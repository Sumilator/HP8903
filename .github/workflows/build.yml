name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64, macOS 10.13+)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check architectures
        run: lipo -info build/hp8903-cli
      - uses: actions/upload-artifact@v4
        with:
          name: hp8903-cli-macos-universal
          path: build/hp8903-cli

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure
